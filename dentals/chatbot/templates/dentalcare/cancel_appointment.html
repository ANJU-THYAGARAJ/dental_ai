{% extends "dentalcare/base.html" %}

{% block title %}Cancel Appointment{% endblock %}

{% block content %}

<div class="container py-5">

    <!-- Page Heading -->
    <div class="page-heading text-center mb-4">
        <span class="eyebrow">APPOINTMENT</span>

        <h1>Cancel Appointment</h1>

       
    </div>


    <!-- Cancellation Form -->
    <div class="panel-card col-lg-8 mx-auto">

        <form id="cancelForm">

            {% csrf_token %}

            <div class="row g-3">

                <!-- Full Name -->
                <div class="col-md-6">
                    <label class="form-label">
                        Full Name *
                    </label>

                    <input
                        type="text"
                        id="cancelName"
                        class="form-control"
                        placeholder="Enter your full name"
                        required
                    >
                </div>


                <!-- Phone Number -->
                <div class="col-md-6">
                    <label class="form-label">
                        Phone Number *
                    </label>

                    <input
                        type="tel"
                        id="cancelPhone"
                        class="form-control"
                        placeholder="Enter your phone number"
                        required
                    >
                </div>


                <!-- Appointment ID -->
                <div class="col-12">

                    <label class="form-label">
                        Appointment ID *
                    </label>

                    <input
                        type="number"
                        id="cancelAppointmentId"
                        class="form-control"
                        placeholder="Example: 1"
                        required
                    >

                    <small class="text-secondary">
                        Enter the appointment ID you received after booking.
                    </small>

                </div>

            </div>


            <!-- Cancel Button -->
            <button
                type="submit"
                class="btn btn-danger rounded-pill px-4 mt-4"
            >
                <i class="bi bi-calendar-x me-2"></i>
                Cancel Appointment
            </button>

        </form>


        <!-- Result -->
        <div id="cancelResult" class="mt-3"></div>

    </div>

</div>

{% endblock %}


{% block scripts %}

<script>

document
    .getElementById("cancelForm")
    .addEventListener("submit", async function (e) {

        e.preventDefault();

        const result =
            document.getElementById("cancelResult");

        // Show loading message
        result.className = "alert alert-info mt-3";
        result.textContent =
            "Cancelling appointment...";


        // Prepare data
        const payload = {

            name:
                document
                    .getElementById("cancelName")
                    .value
                    .trim(),

            phone:
                document
                    .getElementById("cancelPhone")
                    .value
                    .trim(),

            appointment_id:
                document
                    .getElementById("cancelAppointmentId")
                    .value
                    .trim()

        };


        // Get CSRF token
        const csrf =
            document.querySelector(
                "[name=csrfmiddlewaretoken]"
            ).value;


        try {

            // Send request to Django
            const response = await fetch(
                "{% url 'chatbot:cancel_appointment' %}",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json",
                        "X-CSRFToken": csrf
                    },

                    body: JSON.stringify(payload)
                }
            );


            // Convert response to JSON
            const data = await response.json();


            // Success
            if (data.success) {

                result.className =
                    "alert alert-success mt-3";

                result.textContent =
                    data.message;


                // Clear form
                document
                    .getElementById("cancelForm")
                    .reset();

            }


            // Error
            else {

                result.className =
                    "alert alert-danger mt-3";

                result.textContent =
                    data.error ||
                    "Unable to cancel appointment.";

            }

        }


        // Network/server error
        catch (error) {

            result.className =
                "alert alert-danger mt-3";

            result.textContent =
                "Something went wrong. Please try again.";

            console.error(error);

        }

    });

</script>

{% endblock %}
